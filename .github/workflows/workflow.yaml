name: Atualizar Avaliacoes

on:
  schedule:
    - cron: '0 11 * * *'  # Atualiza todo dia às 08:00 BRT (11:00 UTC)
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas requests transformers torch
      - name: Run script
        run: python atualizar_avaliacoes.py
      - name: Commit CSV
        run: |
          git config --local user.email "you@example.com"
          git config --local user.name "GitHub Actions"
          git add avaliacoes.csv
          git commit -m "Atualização diária CSV"
      - name: Push changes
        run: git push https://x-access-token:${{ secrets.WK_TOKEN }}@github.com/Jhonatan-Margraf/Sistema-de-Satisfacao.git HEAD:main
